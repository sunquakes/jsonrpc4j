name: Recover Maven Central Release

on:
  push:
    branches:
      - 'recovery/v3.0.0'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing final release tag to publish (for example, v3.0.0)'
        required: true
        type: string

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || 'v3.0.0' }}
          fetch-depth: 0

      - name: Verify release tag and POM version
        env:
          RELEASE_TAG: ${{ inputs.tag || 'v3.0.0' }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Only an existing final vx.y.z tag can be recovered.'
            exit 1
          fi
          pom_version="$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("pom.xml").getroot().find("{http://maven.apache.org/POM/4.0.0}version").text)')"
          if [[ "$pom_version" != "${RELEASE_TAG#v}" ]]; then
            echo "Tag $RELEASE_TAG does not match POM version $pom_version."
            exit 1
          fi

      - name: Verify GPG signing configuration
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY || secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo 'Set GPG_PRIVATE_KEY or MAVEN_GPG_PRIVATE_KEY before recovering a release.'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: sonatype-release
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Import and verify GPG secret key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY || secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          if ! gpg --with-colons --list-secret-keys | python3 -c 'import sys; raise SystemExit(0 if any(line.startswith("sec:") for line in sys.stdin) else 1)'; then
            echo 'The configured key has no secret component. Export it with gpg --armor --export-secret-keys.'
            exit 1
          fi
          key_fingerprint="$(gpg --with-colons --list-secret-keys | python3 -c 'import sys; lines=iter(sys.stdin); print(next(fields[9] for line in lines if (fields := line.split(":"))[0] == "fpr"))')"
          echo "GPG_KEYNAME=$key_fingerprint" >> "$GITHUB_ENV"

      - name: Verify Central authentication
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          sonatype_token="$(printf '%s:%s' "$MAVEN_USERNAME" "$MAVEN_PASSWORD" | base64 -w0)"
          curl --fail-with-body --silent --show-error \
            --output /dev/null \
            --header "Authorization: Bearer ${sonatype_token}" \
            --header 'Accept: application/json' \
            'https://ossrh-staging-api.central.sonatype.com/manual/search/repositories?ip=client'

      - name: Publish tagged release to Central
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE || secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn --batch-mode package \
            org.apache.maven.plugins:maven-gpg-plugin:3.2.7:sign \
            org.apache.maven.plugins:maven-deploy-plugin:3.1.2:deploy \
            "-Dgpg.keyname=$GPG_KEYNAME" \
            '-DaltDeploymentRepository=sonatype-release::default::https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
          sonatype_token="$(printf '%s:%s' "$MAVEN_USERNAME" "$MAVEN_PASSWORD" | base64 -w0)"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${sonatype_token}" \
            --header 'Accept: application/json' \
            --data '' \
            'https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/com.sunquakes?publishing_type=automatic'
